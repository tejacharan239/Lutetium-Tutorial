<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>SuperImpress promo</title>
<!-- build/fonts.css is generated by fonts.py; the composition falls back to system faces without it -->
<link rel="stylesheet" href="build/fonts.css">
<link rel="stylesheet" href="promo.css">
</head>
<body>
<div id="stage"><div id="cam"></div><div id="light"></div></div>
<script src="engine.js"></script>
<script src="components.js"></script>
<script src="scenes.js"></script>
<script>
// Fonts load lazily, so ask for every face the scenes use before building: the builders
// measure a few words, and the renderer must never capture a frame in a fallback face.
Promise.all([
  '620 84px Fraunces', 'italic 480 58px Fraunces', '760 150px Fraunces',
  '500 36px "DM Sans"', '600 36px "DM Sans"', '700 36px "DM Sans"', '800 36px "DM Sans"',
  '600 21px "IBM Plex Mono"', '500 21px "IBM Plex Mono"', '700 46px Caveat',
].map(f => document.fonts.load(f))).catch(() => {}).then(() => SP.boot());
</script>
</body>
</html>
